baseURL = 'https://amine-maazizi-portfolio.netlify.app/'
theme = "PaperMod"
DefaultContentLanguage = "en"
languageCode = "en-us"

[languages]
  [languages.en]
    title = "Amine Maazizi | Research Student"
    weight = 1
    languageName = "English"
    contentDir = "content/en"
    [languages.en.params]
      description = "Amine Maazizi, MSc. MVA @ ENS Paris-Saclay & MSc. CS @ ENSTA Paris | Geometric Deep Learning & Generative AI"
      # Profile Mode Configuration
      [languages.en.params.profileMode]
        enabled = true
        title = "Amine Maazizi"
        subtitle = "MSc. MVA @ ENS Paris-Saclay • MSc. CS @ ENSTA Paris\n\nResearch Interests: Geometric Deep Learning × Generative AI"
        imageTitle = "Profile Picture of Amine Maazizi"
        imageUrl = "images/profile.jpg"

  [languages.fr]
    title = "Amine Maazizi | Chercheur-Étudiant"
    weight = 2
    languageName = "Français"
    contentDir = "content/fr"
    [languages.fr.params]
      description = "Amine Maazizi, MSc. MVA @ ENS Paris-Saclay & MSc. CS @ ENSTA Paris | Deep Learning Géométrique & IA Générative"
      # Configuration du mode profil
      [languages.fr.params.profileMode]
        enabled = true
        title = "Amine Maazizi"
        subtitle = "MSc. MVA @ ENS Paris-Saclay • MSc. CS @ ENSTA Paris\n\nIntérêts de Recherche: Deep Learning Géométrique × IA Générative"
        imageTitle = "Photo de profil d'Amine Maazizi"
        imageUrl = "images/profile.jpg"

